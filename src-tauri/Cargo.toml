[package]
name = "arch-gen"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# AI / Python Integration
pyo3 = { version = "0.25", features = ["auto-initialize"] }

# Windows COM Integration (Visio / EA)
windows = { version = "0.52", features = [
    "Win32_System_Com", "Win32_System_Ole", "Win32_Foundation",
    # AI providers: DPAPI for stored API keys, Job Objects so a provider's whole process tree stops with its request
    "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading",
] }

# Data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }

# Error handling
anyhow = "1.0"

# Graph / Diagram logic
petgraph = "0.6"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
